# Tiny Tapeout project information
project:
  title:        "tiny-tpu" 
  author:       "itsmeleow"  
  discord:      "1eow"
  description:  "TPU-inspired FP8 accelerator for small Deep Neural Network (DNN) training and inference"
  language:     "Verilog"
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_itsmeleow_tiny_tpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tiny_tpu_generated.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "s_axis_tdata[0] (cmd / FP8 data bit 0)"
  ui[1]: "s_axis_tdata[1] (cmd / FP8 data bit 1)"
  ui[2]: "s_axis_tdata[2] (cmd / FP8 data bit 2)"
  ui[3]: "s_axis_tdata[3] (cmd / FP8 data bit 3)"
  ui[4]: "s_axis_tdata[4] (cmd / FP8 data bit 4)"
  ui[5]: "s_axis_tdata[5] (cmd / FP8 data bit 5)"
  ui[6]: "s_axis_tdata[6] (cmd / FP8 data bit 6)"
  ui[7]: "s_axis_tdata[7] (cmd / FP8 data bit 7)"

  # Outputs
  uo[0]: "m_axis_tdata[0] (result byte bit 0)"
  uo[1]: "m_axis_tdata[1] (result byte bit 1)"
  uo[2]: "m_axis_tdata[2] (result byte bit 2)"
  uo[3]: "m_axis_tdata[3] (result byte bit 3)"
  uo[4]: "m_axis_tdata[4] (result byte bit 4)"
  uo[5]: "m_axis_tdata[5] (result byte bit 5)"
  uo[6]: "m_axis_tdata[6] (result byte bit 6)"
  uo[7]: "m_axis_tdata[7] (result byte bit 7)"

  # Bidirectional pins
  uio[0]: "s_axis_tvalid (input)"
  uio[1]: "s_axis_tready (output)"
  uio[2]: "s_axis_tlast (input)"
  uio[3]: ""
  uio[4]: "m_axis_tvalid (output)"
  uio[5]: "m_axis_tready (input)"
  uio[6]: "m_axis_tlast (output)"
  uio[7]: ""

# Do not change!
yaml_version: 6
